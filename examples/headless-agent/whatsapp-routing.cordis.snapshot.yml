# Keyless real-Loader composition for the WhatsApp per-conversation snapshot.
#
# One inbound message opens one session for the conversation it came from. The
# account is scripted rather than paired, so the router, the Workspace, the
# session title, and the message framing all run their shipped code paths
# without a network or a phone.

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: none

- id: replay
  name: '@deepseek-ai/dsh-llm-replay'
  config:
    file: !!js process.env.DSH_SNAPSHOT_FILE
    overrideFile: !!js process.env.DSH_SNAPSHOT_OVERRIDE

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask

- id: whatsapp
  name: '@deepseek-ai/dsh-whatsapp'

# The Workspace registry the router registers its conversations with, plus the
# storage domain that registry keeps its records in.
- id: storage
  name: '@deepseek-ai/dsh-storage'

- id: storage-json
  name: '@deepseek-ai/dsh-storage-json'
  config:
    root: './.storage'

- id: storage-domain
  name: '@deepseek-ai/dsh-storage-domain'
  config:
    backend: json

- id: workspace
  name: '@deepseek-ai/dsh-workspace'

# No `agents` row: every agent in this composition is opened by the router, one
# per conversation, which is the behavior under test.
- id: agent
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    workspaceContext: false
    skills:
      enabled: false
    toolJobs: false
    goals: false

# The model a routed conversation is answered with: no operator picks one for an
# inbound message.
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: whatsapp-workspace
  name: '@deepseek-ai/dsh-whatsapp-workspace'
  config:
    chats: all
    directory: !!js process.cwd()
    workspaceTitle: WhatsApp

# Registered last: the account needs settled services.
- id: scripted-account
  name: './tests/fixtures/whatsapp-scripted-account.ts'
